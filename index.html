<link rel="manifest" id="manifestLink" href="">
<style>
:root{--bg1:#12324a;--bg2:#1f6f5c;--acc:#ff8a3d;--acc2:#ffd166;--card:#fff8ef;--ink:#1d2a33;--ok:#2bb673;--no:#e4572e;}
body[data-theme="gato"]{--bg1:#5a1a2e;--bg2:#b8473a;--acc:#f2c14e;--acc2:#ffe29a;--card:#fff6e8;--ink:#3a1420;}
body[data-theme="retro"]{--bg1:#140a2e;--bg2:#3a1466;--acc:#ff3ea5;--acc2:#29e7ff;--card:#fdf7ff;--ink:#1b1033;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{font-family:'Nunito',system-ui,-apple-system,sans-serif;font-weight:700;color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overflow-x:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
#decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
#decor span{position:absolute;opacity:.13;font-size:64px;}
#app{position:relative;z-index:1;min-height:100vh;min-height:100dvh;max-width:900px;margin:0 auto;padding:12px 16px 28px;display:flex;flex-direction:column;}
button{font-family:inherit;font-weight:900;border:0;cursor:pointer;color:var(--ink);}
.cur{font-family:'Dancing Script',cursive;font-weight:700;}
.cur .up,.up{font-family:'Nunito',sans-serif;font-weight:900;}
.cur .up{font-size:.82em;}
.hidden{display:none!important;}
img.dr{height:1.15em;width:auto;vertical-align:-0.2em;display:inline-block;}

/* Tema */
.pickTitle{color:#fff;text-align:center;font-size:clamp(26px,5vw,40px);margin:18px 0 6px;}
.pickSub{color:#fff;opacity:.85;text-align:center;margin:0 0 18px;font-size:18px;}
.themes{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
.themeCard{border-radius:28px;padding:22px 16px;min-height:170px;color:#fff;font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 0 rgba(0,0,0,.25);}
.themeCard .e{font-size:72px;line-height:1;}
.avatar{width:120px;height:120px;border-radius:28px;object-fit:cover;box-shadow:0 4px 12px rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.85);display:block;}
.buddyHead .avatar{width:52px;height:52px;border-radius:16px;}
.themeCard small{font-size:16px;opacity:.9;}
.tc-dragon{background:linear-gradient(160deg,#12324a,#1f6f5c);}
.tc-gato{background:linear-gradient(160deg,#5a1a2e,#b8473a);}
.tc-retro{background:linear-gradient(160deg,#140a2e,#3a1466);border:3px solid #29e7ff;}

/* Mapa */
.mapHead{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:10px;}
.buddyHead{display:flex;align-items:center;gap:8px;font-size:22px;flex:1;}
.buddyHead .e{font-size:44px;}
.pill{background:rgba(255,255,255,.18);border-radius:999px;padding:8px 14px;font-size:20px;color:#fff;}
.backBtn{height:56px;padding:0 18px;border-radius:18px;background:rgba(255,255,255,.92);font-size:22px;color:var(--ink);flex:none;box-shadow:0 4px 0 rgba(0,0,0,.25);white-space:nowrap;}
.backBtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25);}
.topbar,.mapHead{position:sticky;top:0;z-index:5;padding:8px 0;background:linear-gradient(var(--bg1) 70%,transparent);}
.iconBtn{width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,.2);font-size:28px;color:#fff;flex:none;}
.world{background:rgba(255,255,255,.12);border-radius:28px;padding:14px;margin:12px 0;}
.world h2{color:#fff;margin:2px 4px 12px;font-size:24px;display:flex;align-items:center;gap:8px;}
.world.locked{opacity:.5;}
.lvls{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
.lvl{background:var(--card);border-radius:22px;padding:12px 8px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 6px 0 rgba(0,0,0,.2);font-size:17px;text-align:center;line-height:1.15;}
.lvl .e{font-size:40px;}
.lvl .st{font-size:18px;letter-spacing:1px;min-height:22px;}
.lvl.done{background:linear-gradient(160deg,var(--card),var(--acc2));}
.lvl:disabled{filter:grayscale(1);}
.lvl:active,.opt:active,.btn:active,.themeCard:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2);}

/* Juego */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.dots{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
.dots i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.3);}
.dots i.on{background:var(--acc2);}
.dots i.now{background:#fff;transform:scale(1.25);}
.prompt{color:#fff;text-align:center;font-size:clamp(26px,5.5vw,44px);margin:6px 0 10px;line-height:1.2;}
.visual{background:var(--card);border-radius:30px;min-height:170px;padding:14px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.2);margin-bottom:16px;}
.bigE{font-size:clamp(84px,18vw,150px);line-height:1;}
.items{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;font-size:clamp(34px,7vw,54px);max-width:560px;}
.items .x{position:relative;opacity:.35;}
.items .x::after{content:'✖';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--no);opacity:1;font-size:.9em;}
.eq{font-size:clamp(46px,10vw,80px);color:var(--ink);margin:0 10px;}
.sent{font-size:clamp(34px,7vw,56px);}
.blank{display:inline-block;min-width:2.4em;border-bottom:5px solid var(--acc);margin:0 .15em;}
.groups{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:620px;}
.grp{border:3px solid var(--acc);border-radius:14px;padding:5px;display:flex;flex-wrap:wrap;gap:3px;width:70px;justify-content:center;}
.grp b{width:11px;height:11px;border-radius:50%;background:var(--acc);display:block;}
.opts{display:grid;gap:14px;grid-template-columns:repeat(3,1fr);}
.opts.n4{grid-template-columns:repeat(2,1fr);}
.opts.n2{grid-template-columns:repeat(2,1fr);}
.opt{background:var(--card);border-radius:26px;min-height:120px;font-size:clamp(34px,7vw,58px);box-shadow:0 7px 0 rgba(0,0,0,.25);padding:8px;line-height:1.1;transition:opacity .2s;}
.opt.wordy{font-size:clamp(26px,5vw,44px);}
.opt.good{background:var(--ok);color:#fff;}
.opt.bad{background:#f3c7bb;opacity:.45;animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.btn{border-radius:24px;padding:16px 20px;font-size:24px;background:var(--card);box-shadow:0 6px 0 rgba(0,0,0,.25);}
.btn.ok{background:var(--ok);color:#fff;font-size:30px;padding:22px;width:100%;}
.btn.acc{background:var(--acc);color:#fff;}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:14px;}
.link{background:none;color:#fff;opacity:.75;font-size:18px;margin-top:10px;padding:10px;}
.mTip{font-size:22px;opacity:.8;margin-top:8px;}
.mText{font-size:clamp(28px,6vw,46px);}
.modelCard{flex-direction:column;}
.timer{height:22px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden;margin:0 0 14px;}
.timer .bar{height:100%;width:0;background:var(--acc2);border-radius:999px;}
.buddyFloat{position:fixed;left:14px;bottom:calc(10px + env(safe-area-inset-bottom));font-size:54px;z-index:3;pointer-events:none;transition:transform .3s;}
.buddyFloat.jump{transform:translateY(-30px) rotate(-8deg) scale(1.15);}
#mirror{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:min(38vw,260px);aspect-ratio:1;border-radius:50%;object-fit:cover;transform:scaleX(-1);border:6px solid var(--acc2);z-index:4;background:#000;box-shadow:0 8px 20px rgba(0,0,0,.35);}

/* Fin */
.endCard{background:var(--card);border-radius:34px;padding:28px 18px;text-align:center;margin-top:20px;box-shadow:0 10px 0 rgba(0,0,0,.25);}
.endStars{font-size:70px;letter-spacing:6px;}
.endCard h2{font-size:36px;margin:10px 0;}
.burst{position:fixed;pointer-events:none;font-size:42px;z-index:9;animation:fly 1s ease-out forwards;}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(1.4);opacity:0;}}

/* Pestañas y juegos */
.tabbar{position:sticky;bottom:0;z-index:6;display:flex;gap:10px;padding:12px 0 calc(8px + env(safe-area-inset-bottom));margin-top:auto;background:linear-gradient(transparent,var(--bg2) 35%);}
.tab{flex:1;height:66px;border-radius:22px;font-size:24px;background:rgba(255,255,255,.22);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2);}
.tab.on{background:var(--card);color:var(--ink);}
.gameHead{color:#fff;font-size:26px;margin:14px 4px 10px;display:flex;align-items:center;gap:8px;}
.soon{opacity:.55;}
.cards{display:grid;gap:12px;grid-template-columns:repeat(var(--cols),1fr);max-width:720px;width:100%;margin:0 auto;}
.card{aspect-ratio:3/4;border-radius:22px;font-size:clamp(30px,7.5vw,60px);box-shadow:0 6px 0 rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;padding:6px;line-height:1.05;text-align:center;
  background:linear-gradient(160deg,var(--acc),var(--acc2));color:#fff;transition:transform .25s;}
.card .back{font-size:.9em;opacity:.9;}
.card.open,.card.done{background:var(--card);color:var(--ink);transform:rotateY(0) scale(1.03);}
.card.done{background:#c9f2dc;box-shadow:0 2px 0 rgba(0,0,0,.15);}
.card.small{font-size:clamp(22px,5vw,40px);}
.card .mini{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:.5em;}
img.pic{width:1em;height:1em;object-fit:contain;vertical-align:middle;border-radius:.12em;}
.bigE img.pic{border-radius:18px;}
/* Adultos */
#adult{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;}
.panel{background:#fff;border-radius:24px;padding:22px;max-width:480px;width:100%;max-height:90vh;overflow:auto;}
.panel h3{margin:0 0 12px;font-size:24px;}
.panel label{display:block;margin:14px 0 6px;font-size:18px;}
.panel input[type=range]{width:100%;}
.panel .btn{font-size:18px;padding:12px 16px;margin:6px 6px 0 0;}
.panel p{font-size:15px;opacity:.75;font-weight:700;line-height:1.4;}
@media (max-width:420px){.opt{min-height:96px;}.lvls{grid-template-columns:repeat(2,1fr);}}
</style>
</head>

const missing=new Set();const player=new Audio();player.preload='auto';player.setAttribute('playsinline','');
let sayToken=0;
function stopSpeech(){sayToken++;try{player.pause();}catch(e){}if('speechSynthesis' in window)speechSynthesis.cancel();}
function filePart(s){return new Promise(res=>{
  if(missing.has(s))return res(false);
  let done=false,to;const fin=(ok,mark)=>{if(done)return;done=true;clearTimeout(to);player.onended=player.onerror=null;if(mark)missing.add(s);res(ok);};
  player.onended=()=>fin(true);player.onerror=()=>fin(false,true);
  player.src=AUDIO_DIR+s+AUDIO_EXT;const p=player.play();if(p&&p.catch)p.catch(err=>fin(false,err&&err.name!=='NotAllowedError'&&err.name!=='AbortError'));
  to=setTimeout(()=>fin(true),15000);});}
function ttsPart(t,rate){return new Promise(res=>{
  if(!('speechSynthesis' in window))return res();
  const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';if(voice)u.voice=voice;u.rate=rate||S.rate;u.pitch=1.05;
  let done=false;const fin=()=>{if(!done){done=true;res();}};u.onend=fin;u.onerror=fin;setTimeout(fin,1500+t.length*130);
  setTimeout(()=>speechSynthesis.speak(u),60);});}
async function say(t,rate){
  if(!t)return;stopSpeech();const my=sayToken;
  const parts=String(t).split('|').map(x=>x.trim()).filter(Boolean);
  for(const p of parts){
    if(my!==sayToken)return;const s=slug(p);if(!s)continue;
    const ok=await filePart(s);if(my!==sayToken)return;
    if(!ok)await ttsPart(p,rate);
  }
}

let AC;
function tone(fs,dur=.14,type='sine',gap=.09,vol=.22){
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime;fs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
      const s=t+i*gap;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(vol,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+dur);
      o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+dur+.05);});
  }catch(e){}
}

  suma({max,vis}){const a=rand(1,max-1),b=rand(1,max-a),r=a+b,e=T().item;
    const v=vis?itemsHTML(a,e)+'<span class="eq">+</span>'+itemsHTML(b,e):'<span class="eq">'+a+' + '+b+'</span>';
    return{prompt:a+' + '+b+' = ?',speak:a+'|más|'+b,visual:v,options:numOpts(r,0,max),answer:String(r),after:a+'|más|'+b+'|son|'+r};},
  resta({max,vis}){const a=rand(2,max),b=rand(1,a-1),r=a-b;
    const v=vis?itemsHTML(a,T().item,a-b):'<span class="eq">'+a+' − '+b+'</span>';
    return{prompt:a+' − '+b+' = ?',speak:a+'|menos|'+b,visual:v,options:numOpts(r,0,max),answer:String(r),after:a+'|menos|'+b+'|son|'+r};},
  tabla(list){const n=pick(list),k=rand(1,10),r=n*k;
    const v='<div><div class="groups">'+Array.from({length:k},()=>'<div class="grp">'+'<b></b>'.repeat(n)+'</div>').join('')+'</div><div style="margin-top:8px;font-size:22px">'+k+' grupos de '+n+'</div></div>';
    const opts=shuffle([r,...sample([...new Set([r+n,r-n,r+1,r-1].filter(x=>x>0&&x!==r))],2)]).map(x=>({html:String(x),v:String(x)}));
    return{prompt:k+' × '+n+' = ?',speak:k+'|por|'+n,visual:v,options:opts,answer:String(r),after:k+'|por|'+n+'|son|'+r};}
};

/* ============ Imágenes propias: img/<nombre>.png o .jpg; si no existe, emoji ============ */
const noImg=new Set();
function pic(word,e){const s=slug(word);if(noImg.has(s))return e;return '<img class="pic" src="img/'+s+'.png" data-s="'+s+'" data-e="'+e+'" alt="" onerror="imgFail(this)">';}
function imgFail(el){if(!el.dataset.j){el.dataset.j='1';el.src='img/'+el.dataset.s+'.jpg';return;}noImg.add(el.dataset.s);el.replaceWith(document.createTextNode(el.dataset.e));}

/* ============ Pantallas ============ */
const app=$('#app');
let G=null,mirrorStream=null,timerId=null;

function setTheme(t){S.theme=t;save();document.body.dataset.theme=t;decor();makeIcon();}
function decor(){const d=$('#decor');d.innerHTML='';const em=T().decor;for(let i=0;i<14;i++){const s=document.createElement('span');s.textContent=pick(em);s.style.left=rand(0,95)+'%';s.style.top=rand(0,95)+'%';s.style.transform='rotate('+rand(-25,25)+'deg)';d.appendChild(s);}}
function buddy(show,jump){const b=$('#buddy');b.textContent=buddyEmoji();b.classList.toggle('hidden',!show);if(jump){b.classList.add('jump');setTimeout(()=>b.classList.remove('jump'),450);}}

function showThemes(){

  app.innerHTML=(S.theme?'<div class="topbar"><button class="backBtn" data-a="map">⬅️ Atrás</button></div>':'')+'<h1 class="pickTitle">¿Con quién juegas hoy?</h1><p class="pickSub">Toca tu aventura</p><div class="themes">'+
    Object.entries(THEMES).map(([k,t])=>'<button class="themeCard tc-'+k+'" data-a="pickTheme" data-v="'+k+'">'+buddyHTML(k)+t.name+'<small>'+t.sub+'</small></button>').join('')+'</div>';

function showMap(){
  stopAll();buddy(false);
  const total=Object.values(S.stars).reduce((a,b)=>a+b,0);
  let h='<div class="mapHead"><button class="backBtn" data-a="themes">⬅️ Atrás</button><div class="buddyHead">'+(BUDDY_IMG[S.theme]?buddyHTML():'<span class="e">'+buddyEmoji()+'</span>')+T().buddy+'</div><div class="pill">⭐ '+total+'</div><button class="iconBtn" id="gear">⚙️</button></div>';

      w.map(l=>{const st=S.stars[l.id]||0;return '<button class="lvl'+(st?' done':'')+'" data-a="play" data-v="'+l.id+'"'+(open?'':' disabled')+'><span class="e">'+UICON[l.u]+'</span>'+l.t+'<span class="st">'+(st?'⭐'.repeat(st):'')+'</span></button>';}).join('')+'</div></section>';});

function findLevel(id){for(const w of WORLDS)for(const l of w)if(l.id===id)return l;}

function startLevel(id){
  const L=findLevel(id);G={L,i:0,errors:0,miss:false};
  if(L.k==='praxia'||L.k==='modelo'){G.items=L.k==='praxia'?PRAXIAS[L.p]:shuffle(SONIDOS[L.p]).slice(0,8);G.n=G.items.length;showModel();}
  else{G.n=S.rounds;nextQ();}
}

function dotsHTML(){return '<div class="dots">'+Array.from({length:G.n},(_,i)=>'<i class="'+(i<G.i?'on':i===G.i?'now':'')+'"></i>').join('')+'</div>';}

/* --- Preguntas --- */
function nextQ(){
  if(!G)return;if(G.i>=G.n)return finish();
  let q,tries=0;do{q=GEN[G.L.k](G.L.p,G.L.m);tries++;}while(G.last&&q.answer===G.last&&tries<5);
  G.q=q;G.last=q.answer;G.locked=false;
  const n=q.options.length;
  app.innerHTML='<div class="topbar"><button class="backBtn" data-a="map">⬅️ Atrás</button>'+dotsHTML()+'<button class="iconBtn" data-a="replay">🔊</button></div>'+
    '<div class="prompt">'+q.prompt+'</div><div class="visual" data-a="replay">'+q.visual+'</div>'+
    '<div class="opts n'+n+'">'+q.options.map(o=>'<button class="opt'+(q.wordy?' wordy':'')+'" data-a="opt" data-v="'+o.v.replace(/"/g,'&quot;')+'">'+o.html+'</button>').join('')+'</div>';
  buddy(true);
  setTimeout(()=>say(q.speak),250);
}
function answer(btn){
  if(G.locked)return;
  if(btn.dataset.v===G.q.answer){
    G.locked=true;btn.classList.add('good');sfx.ok();burst(btn);buddy(true,true);
    say((G.q.after?G.q.after+'|':'')+pick(T().cheer));
    G.i++;const g=G;setTimeout(()=>{if(G===g)nextQ();},G.q.after?2300:1500);
  }else{
    if(btn.classList.contains('bad'))return;
    btn.classList.add('bad');G.errors++;sfx.no();say(pick(['Casi. Prueba otra vez.','Mmm, otra vez.','¡Tú puedes! Otra vez.']));
  }
}

/* --- Modelo e imitación (praxias y sonidos) --- */
function showModel(){
  if(!G)return;if(G.i>=G.n)return finish();
  const it=G.items[G.i],isP=G.L.k==='praxia';
  const big=isP?'<div class="bigE">'+it.e+'</div><div class="mText">'+it.t+'</div>':
    (it.e?'<div class="bigE" style="font-size:80px">'+pic(it.b,it.e)+'</div>':'')+'<div class="mText" style="font-size:clamp(56px,13vw,110px)">'+txt(it.b,G.L.m)+'</div>';
  const tip=it.tip?'<div class="mTip">'+it.tip+'</div>':'';
  app.innerHTML='<div class="topbar"><button class="backBtn" data-a="map">⬅️ Atrás</button>'+dotsHTML()+'<button class="iconBtn" data-a="mirror">🪞</button></div>'+
    '<div class="prompt">'+(isP?buddyEmoji()+' ¡Hazlo como yo!':'Escucha y dilo tú')+'</div>'+
    '<div class="visual modelCard" data-a="replay">'+big+tip+'</div>'+
    (it.hold?'<div class="timer"><div class="bar" id="bar"></div></div>':'')+
    '<div class="row"><button class="btn" data-a="replay">🔊 Otra vez</button>'+(it.hold?'<button class="btn acc" data-a="go">▶️ ¡Ya! ('+it.hold+' s)</button>':'')+'</div>'+
    '<button class="btn ok" data-a="done">✅ ¡Lo hice!</button><div style="text-align:center"><button class="link" data-a="skip">Saltar ⏭️</button></div>';
  buddy(!mirrorStream);
  setTimeout(()=>say(isP?it.s:it.s,isP?S.rate:Math.min(S.rate,0.75)),250);
}
function replay(){if(!G)return;if(G.items){const it=G.items[G.i];if(it)say(it.s,G.L.k==='praxia'?S.rate:Math.min(S.rate,0.75));}else if(G.q)say(G.q.speak);}
function runTimer(){
  const it=G.items[G.i],bar=$('#bar');if(!bar)return;clearInterval(timerId);
  bar.style.transition='none';bar.style.width='0';void bar.offsetWidth;
  bar.style.transition='width '+it.hold+'s linear';bar.style.width='100%';
  let s=0;sfx.tick();timerId=setInterval(()=>{s++;if(s>=it.hold){clearInterval(timerId);sfx.ok();say('¡Muy bien, ya!');}else sfx.tick();},1000);
}
function modelDone(skip){if(!G||G.busy)return;G.busy=true;const g=G;clearInterval(timerId);if(!skip){sfx.ok();burst($('[data-a="done"]'));say(pick(T().cheer));}G.i++;setTimeout(()=>{if(G===g){G.busy=false;showModel();}},skip?100:1200);}

async function toggleMirror(){
  const v=$('#mirror');
  if(mirrorStream){stopMirror();buddy(true);return;}
  try{mirrorStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});v.srcObject=mirrorStream;v.classList.remove('hidden');buddy(false);}
  catch(e){alert('No se pudo abrir la cámara. Revisa en Ajustes que la app tenga permiso de cámara.');}
}
function stopMirror(){if(mirrorStream){mirrorStream.getTracks().forEach(t=>t.stop());mirrorStream=null;}const v=$('#mirror');v.srcObject=null;v.classList.add('hidden');}
function stopAll(){clearInterval(timerId);stopMirror();stopSpeech();}

/* --- Final de nivel --- */
function finish(){
  stopAll();
  const stars=G.items?3:(G.errors<=1?3:G.errors<=3?2:1);
  const wasOpen=WORLDS.map((w,wi)=>worldOpen(wi));
  S.stars[G.L.id]=Math.max(S.stars[G.L.id]||0,stars);save();
  const newWorld=WORLDS.findIndex((w,wi)=>!wasOpen[wi]&&worldOpen(wi));
  sfx.win();buddy(true,true);
  const msg=newWorld>0?'¡Has abierto un mundo nuevo: '+T().worlds[newWorld]+'!':pick(T().cheer);
  app.innerHTML='<div class="topbar"><button class="backBtn" data-a="map">⬅️ Atrás</button></div><div class="endCard"><div class="bigE">'+buddyEmoji()+T().reward+'</div><div class="endStars">'+'⭐'.repeat(stars)+'</div><h2>'+msg+'</h2>'+
    '<div class="row" style="margin-top:18px"><button class="btn acc" data-a="again">🔁 Otra vez</button><button class="btn" data-a="map">🗺️ Mapa</button></div></div>';
  say('¡Nivel terminado, Claudia!|'+(newWorld>0?'¡Has abierto un mundo nuevo!|'+T().worlds[newWorld]:msg));
  for(let i=0;i<8;i++)setTimeout(()=>burst(app.querySelector('.endStars')),i*120);
}
function burst(el){if(!el)return;const r=el.getBoundingClientRect();for(let i=0;i<6;i++){const s=document.createElement('div');s.className='burst';s.textContent=pick(['⭐','✨',T().reward]);
  s.style.left=(r.left+r.width/2-20)+'px';s.style.top=(r.top+r.height/2-20)+'px';s.style.setProperty('--dx',rand(-160,160)+'px');s.style.setProperty('--dy',rand(-200,-40)+'px');
  document.body.appendChild(s);setTimeout(()=>s.remove(),1000);}}

/* ============ JUEGOS ============ */
const tabbar=on=>'<div class="tabbar"><button class="tab'+(on==='map'?' on':'')+'" data-a="map">🗺️ Aventura</button><button class="tab'+(on==='games'?' on':'')+'" data-a="games">🎮 Juegos</button></div>';
const LSHORT=L=>LNAME[L].split(',')[0];
const PAIR_MODES=[
  {id:'iguales3',t:'Dibujos iguales',ic:'🖼️',n:3},
  {id:'iguales4',t:'Más dibujos iguales',ic:'🖼️',n:4},
  {id:'letraDibujo',t:'LETRA ↔ DIBUJO',ic:'🔤',n:3},
  {id:'numCantidad',t:'NÚMERO ↔ CANTIDAD',ic:'🔢',n:4},
  {id:'palabraDibujo',t:'PALABRA ↔ DIBUJO',ic:'📖',n:4},
  {id:'mayLig',t:'MAYÚSCULA ↔ ligada',ic:'✍️',n:4},
  {id:'sumaRes',t:'SUMA ↔ RESULTADO',ic:'➕',n:4},
  {id:'ligDibujo',t:'palabra ligada ↔ dibujo',ic:'✍️',n:5}
];
function pairCards(id,n){
  const P=[];
  if(id==='iguales3'||id==='iguales4'){sample(WORDS.faciles,n).forEach(([w,e])=>{P.push([{h:pic(w,e),s:w},{h:pic(w,e),s:w}]);});}
  if(id==='letraDibujo'){const seen=new Set();shuffle(WORDS.faciles.filter(w=>LNAME[w[0][0].toUpperCase()])).forEach(([w,e])=>{const L=w[0].toUpperCase();if(seen.has(L)||seen.size>=n)return;seen.add(L);
    P.push([{h:letterHTML(L,'up'),s:LSHORT(L)},{h:pic(w,e),s:w}]);});}
  if(id==='numCantidad'){sample([1,2,3,4,5,6],n).forEach(k=>P.push([{h:String(k),s:String(k)},{h:'<div class="mini">'+(T().item+' ').repeat(k)+'</div>',s:String(k)}]));}
  if(id==='palabraDibujo'){sample(WORDS.faciles,n).forEach(([w,e])=>P.push([{h:txt(w,'up'),s:w,sm:1},{h:pic(w,e),s:w}]));}
  if(id==='ligDibujo'){sample(WORDS.faciles,n).forEach(([w,e])=>P.push([{h:txt(w,'cur'),s:w,sm:1},{h:pic(w,e),s:w}]));}
  if(id==='mayLig'){sample([...LETTERS.vocales,...LETTERS.cons1],n).forEach(L=>P.push([{h:letterHTML(L,'up'),s:LSHORT(L)},{h:letterHTML(L,'cur'),s:LSHORT(L)}]));}
  if(id==='sumaRes'){const used=new Set();while(P.length<n){const a=rand(1,5),b=rand(1,5),r=a+b;if(used.has(r))continue;used.add(r);
    P.push([{h:a+'+'+b,s:a+'|más|'+b,sm:1},{h:String(r),s:String(r)}]);}}
  const cards=[];P.forEach((p,k)=>p.forEach(c=>cards.push(Object.assign({k},c))));return shuffle(cards);
}
let PG=null;
function showGames(){
  stopAll();G=null;PG=null;buddy(false);
  let h='<div class="topbar"><button class="backBtn" data-a="map">⬅️ Atrás</button><div style="flex:1"></div></div>';
  h+='<div class="gameHead">🃏 Parejas</div><div class="lvls">'+PAIR_MODES.map(m=>{const st=S.stars['pairs_'+m.id]||0;
    return '<button class="lvl'+(st?' done':'')+'" data-a="pairs" data-v="'+m.id+'"><span class="e">'+m.ic+'</span>'+m.t+'<span class="st">'+(st?'⭐'.repeat(st):'')+'</span></button>';}).join('')+'</div>';
  h+='<div class="gameHead soon">🔜 Muy pronto</div><div class="lvls soon">'+[['🎵','Simón de sonidos'],['🎈','Explota globos'],['🐹','Topo saltarín'],['🧱','Construye la palabra'],['🛒','La tienda']]
    .map(([e,t])=>'<button class="lvl" disabled><span class="e">'+e+'</span>'+t+'</button>').join('')+'</div>';
  app.innerHTML=h+tabbar('games');
}
function startPairs(id){
  stopAll();const m=PAIR_MODES.find(x=>x.id===id);
  PG={m,cards:pairCards(id,m.n),open:[],lock:false,tries:0,found:0};
  const cols=PG.cards.length<=6?3:4;
  app.innerHTML='<div class="topbar"><button class="backBtn" data-a="games">⬅️ Atrás</button><div class="dots" id="pdots"></div><button class="iconBtn" data-a="pairs" data-v="'+id+'">🔄</button></div>'+
    '<div class="prompt">Busca las parejas</div><div class="cards" style="--cols:'+cols+'">'+
    PG.cards.map((c,i)=>'<button class="card'+(c.sm?' small':'')+'" data-a="card" data-v="'+i+'"><span class="back">'+buddyEmoji()+'</span></button>').join('')+'</div>';
  pairDots();buddy(true);setTimeout(()=>say('Busca las parejas'),250);
}
function pairDots(){const d=$('#pdots');if(d)d.innerHTML=Array.from({length:PG.m.n},(_,i)=>'<i class="'+(i<PG.found?'on':'')+'"></i>').join('');}
function flipCard(btn){
  if(!PG||PG.lock)return;const i=+btn.dataset.v,c=PG.cards[i];
  if(c.done||PG.open.includes(i))return;
  btn.classList.add('open');btn.innerHTML=c.h;sfx.tap();PG.open.push(i);
  if(PG.open.length<2){say(c.s);return;}
  PG.tries++;const [a,b]=PG.open,ca=PG.cards[a],cb=PG.cards[b];
  const btns=app.querySelectorAll('.card');
  if(ca.k===cb.k){
    ca.done=cb.done=true;PG.open=[];PG.found++;
    setTimeout(()=>{sfx.ok();btns[a].classList.add('done');btns[b].classList.add('done');burst(btns[b]);buddy(true,true);pairDots();},350);
    say(c.s+'|¡Pareja!');
    if(PG.found===PG.m.n){const pg=PG;setTimeout(()=>{if(PG===pg)pairsEnd();},2200);}
  }else{
    PG.lock=true;say(c.s);const pg=PG;
    setTimeout(()=>{if(PG!==pg)return;[a,b].forEach(x=>{btns[x].classList.remove('open');btns[x].innerHTML='<span class="back">'+buddyEmoji()+'</span>';});PG.open=[];PG.lock=false;},1500);
  }
}
function pairsEnd(){
  const n=PG.m.n,stars=PG.tries<=n+1?3:PG.tries<=n*2?2:1,id=PG.m.id;
  S.stars['pairs_'+id]=Math.max(S.stars['pairs_'+id]||0,stars);save();
  sfx.win();buddy(true,true);const msg=pick(T().cheer);
  app.innerHTML='<div class="topbar"><button class="backBtn" data-a="games">⬅️ Atrás</button></div><div class="endCard"><div class="bigE">'+buddyEmoji()+T().reward+'</div><div class="endStars">'+'⭐'.repeat(stars)+'</div><h2>¡Todas las parejas! '+msg+'</h2>'+
    '<div class="row" style="margin-top:18px"><button class="btn acc" data-a="pairs" data-v="'+id+'">🔁 Otra vez</button><button class="btn" data-a="games">🎮 Juegos</button></div></div>';
  say('¡Todas las parejas!|'+msg);
  for(let i=0;i<8;i++)setTimeout(()=>burst(app.querySelector('.endStars')),i*120);
}

/* --- Zona de adultos (mantener pulsado ⚙️ 2 segundos) --- */
function holdGear(){
  const g=$('#gear');if(!g)return;let t;
  const start=e=>{e.preventDefault();g.style.background='rgba(255,255,255,.5)';t=setTimeout(showAdult,2000);};
  const end=()=>{clearTimeout(t);g.style.background='';};
  g.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(ev=>g.addEventListener(ev,end));
}
function showAdult(){
  const d=document.createElement('div');d.id='adult';
  d.innerHTML='<div class="panel"><h3>⚙️ Zona de papá y mamá</h3>'+
    '<label>Velocidad de la voz: <span id="rv">'+S.rate.toFixed(2)+'</span></label><input type="range" min="0.6" max="1.1" step="0.05" value="'+S.rate+'" id="rate">'+
    '<label>Preguntas por nivel</label><div>'+[4,6,8,10].map(n=>'<button class="btn'+(S.rounds===n?' acc':'')+'" data-ad="rounds" data-v="'+n+'">'+n+'</button>').join('')+'</div>'+
    '<label>Progreso</label><button class="btn" data-ad="all">'+(S.all?'🔒 Volver a bloquear mundos':'🔓 Abrir todos los mundos')+'</button><button class="btn" data-ad="reset">🗑️ Borrar progreso</button>'+
    '<p>En los ejercicios de boca y sonidos, el adulto decide cuándo pulsar «¡Lo hice!». El botón 🪞 abre la cámara frontal como espejo para que Claudia se vea.</p>'+
    '<button class="btn acc" data-ad="close" style="width:100%;margin-top:10px">Cerrar</button></div>';
  document.body.appendChild(d);
  $('#rate').oninput=e=>{S.rate=+e.target.value;$('#rv').textContent=S.rate.toFixed(2);save();};
  $('#rate').onchange=()=>say('Así hablo ahora');
  d.onclick=e=>{const b=e.target.closest('[data-ad]');if(!b)return;const a=b.dataset.ad;
    if(a==='rounds'){S.rounds=+b.dataset.v;save();d.remove();showAdult();}
    if(a==='all'){S.all=!S.all;save();d.remove();showMap();}
    if(a==='reset'&&confirm('¿Borrar todas las estrellas?')){S.stars={};S.all=false;save();d.remove();showMap();}
    if(a==='close'){d.remove();showMap();}};
}

/* --- Eventos --- */
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a!=='opt'&&a!=='replay'&&a!=='card')sfx.tap();
  if(a==='pickTheme'){setTheme(b.dataset.v);say(T().intro);showMap();}
  else if(a==='themes')showThemes();
  else if(a==='play')startLevel(b.dataset.v);
  else if(a==='map'){G=null;PG=null;showMap();}
  else if(a==='opt')answer(b);
  else if(a==='replay')replay();
  else if(a==='go')runTimer();
  else if(a==='done')modelDone(false);
  else if(a==='skip')modelDone(true);
  else if(a==='mirror')toggleMirror();
  else if(a==='again')startLevel(G.L.id);
  else if(a==='games')showGames();
  else if(a==='pairs')startPairs(b.dataset.v);
  else if(a==='card')flipCard(b);
});

/* ============ PWA: icono y manifest generados ============ */
function makeIcon(){
  const bi=BUDDY_IMG[S.theme||'dragon'];if(bi){setManifest(bi,'image/jpeg');return;}
  try{const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');
    const cs=getComputedStyle(document.body),g=x.createLinearGradient(0,0,512,512);
    g.addColorStop(0,cs.getPropertyValue('--bg1').trim()||'#12324a');g.addColorStop(1,cs.getPropertyValue('--bg2').trim()||'#1f6f5c');
    x.fillStyle=g;x.fillRect(0,0,512,512);x.font='300px "Apple Color Emoji","Segoe UI Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(buddyEmoji(),256,280);
    setManifest(c.toDataURL('image/png'),'image/png');
  }catch(e){}
}
function setManifest(png,type){
  try{$('#appleIcon').href=png;
    const m={name:'Las Aventuras de Claudia',short_name:'Aventuras',start_url:location.href.split('#')[0].split('?')[0],scope:location.href.split('#')[0].split('?')[0].replace(/[^/]*$/,''),display:'standalone',orientation:'any',background_color:'#12324a',theme_color:'#12324a',icons:[{src:png,sizes:'512x512',type:type,purpose:'any'}]};
    $('#manifestLink').href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(m));
  }catch(e){}
}

/* ============ Cambiar el emoji 🐉 por la imagen del dragón en toda la app ============ */
function swapDragon(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.indexOf('🐉')>=0?1:2});
  const list=[];while(w.nextNode())list.push(w.currentNode);
  list.forEach(n=>{const parts=n.nodeValue.split('🐉');const f=document.createDocumentFragment();
    parts.forEach((p,i)=>{if(p)f.appendChild(document.createTextNode(p));if(i<parts.length-1){const im=document.createElement('img');im.className='dr';im.src=DRAGON_MINI;im.alt='dragón';f.appendChild(im);}});
    n.parentNode.replaceChild(f,n);});
}
new MutationObserver(ms=>ms.forEach(m=>{m.addedNodes.forEach(n=>{if(n.nodeType===3){if(n.parentNode&&n.nodeValue.indexOf('🐉')>=0)swapDragon(n.parentNode);}else if(n.nodeType===1)swapDragon(n);});if(m.type==='characterData'&&m.target.parentNode)swapDragon(m.target.parentNode);}))
  .observe(document.body,{childList:true,subtree:true,characterData:true});

/* ============ Arranque ============ */
if(S.theme){document.body.dataset.theme=S.theme;decor();makeIcon();showMap();}else{decor();makeIcon();showThemes();}
</script>
