<style>
:root{--bg1:#12324a;--bg2:#1f6f5c;--acc:#ff8a3d;--acc2:#ffd166;--card:#fff8ef;--ink:#1d2a33;--ok:#2bb673;--no:#e4572e;}
body[data-theme="gato"]{--bg1:#5a1a2e;--bg2:#b8473a;--acc:#f2c14e;--acc2:#ffe29a;--card:#fff6e8;--ink:#3a1420;}
body[data-theme="retro"]{--bg1:#140a2e;--bg2:#3a1466;--acc:#ff3ea5;--acc2:#29e7ff;--card:#fdf7ff;--ink:#1b1033;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{font-family:'Nunito',system-ui,-apple-system,sans-serif;font-weight:700;color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overflow-x:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
#decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
#decor span{position:absolute;opacity:.13;font-size:64px;}
#app{position:relative;z-index:1;min-height:100vh;min-height:100dvh;max-width:900px;margin:0 auto;padding:12px 16px 28px;display:flex;flex-direction:column;}
button{font-family:inherit;font-weight:900;border:0;cursor:pointer;color:var(--ink);}
.cur{font-family:'Dancing Script',cursive;font-weight:700;}
.cur .up,.up{font-family:'Nunito',sans-serif;font-weight:900;}
.cur .up{font-size:.82em;}
.hidden{display:none!important;}
img.dr{height:1.15em;width:auto;vertical-align:-0.2em;display:inline-block;}

/* Tema */
.pickTitle{color:#fff;text-align:center;font-size:clamp(26px,5vw,40px);margin:18px 0 6px;}
.pickSub{color:#fff;opacity:.85;text-align:center;margin:0 0 18px;font-size:18px;}
.themes{display:grid;gap:14px;grid-template-columns:repeat(2,1fr);max-width:680px;width:100%;margin:0 auto;}
.themeCard{border-radius:28px;padding:22px 16px;min-height:170px;color:#fff;font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 0 rgba(0,0,0,.25);}
.themeCard .e{font-size:72px;line-height:1;}
.avatar{width:min(85%,230px);height:auto;aspect-ratio:1;border-radius:28px;object-fit:cover;box-shadow:0 4px 12px rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.85);display:block;}
.buddyHead .avatar{width:60px;height:60px;border-radius:16px;}
.themeCard small{font-size:16px;opacity:.9;}
.tc-dragon{background:linear-gradient(160deg,#12324a,#1f6f5c);}
.tc-gato{background:linear-gradient(160deg,#5a1a2e,#b8473a);}
.tc-juegos{background:linear-gradient(160deg,#0f5c8c,#2bb673);border:3px solid #ffd166;}
.tc-juegos .e{font-size:72px;line-height:1;}
.tc-3d{background:linear-gradient(160deg,#3a1466,#0f5c8c);border:3px solid #29e7ff;grid-column:1/-1;min-height:150px;font-size:30px;}
.tc-3d .e{font-size:72px;line-height:1;}
.tc-retro{background:linear-gradient(160deg,#140a2e,#3a1466);border:3px solid #29e7ff;}

/* Mapa */
.mapHead{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:10px;}
.buddyHead{display:flex;align-items:center;gap:8px;font-size:22px;flex:1;}
.buddyHead .e{font-size:44px;}
.pill{background:rgba(255,255,255,.18);border-radius:999px;padding:8px 14px;font-size:20px;color:#fff;}
.backBtn{height:56px;padding:0 18px;border-radius:18px;background:rgba(255,255,255,.92);font-size:22px;color:var(--ink);flex:none;box-shadow:0 4px 0 rgba(0,0,0,.25);white-space:nowrap;}
.backBtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25);}
.topbar,.mapHead{position:sticky;top:0;z-index:5;padding:8px 0;background:linear-gradient(var(--bg1) 70%,transparent);}
.iconBtn{width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,.2);font-size:28px;color:#fff;flex:none;}
.world{background:rgba(255,255,255,.12);border-radius:28px;padding:14px;margin:12px 0;}
.world h2{color:#fff;margin:2px 4px 12px;font-size:24px;display:flex;align-items:center;gap:8px;}
.world.locked{opacity:.5;}
.lvls{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
.lvl{background:var(--card);border-radius:22px;padding:12px 8px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 6px 0 rgba(0,0,0,.2);font-size:17px;text-align:center;line-height:1.15;}
.lvl .e{font-size:40px;}
.lvl .st{font-size:18px;letter-spacing:1px;min-height:22px;}
.lvl.done{background:linear-gradient(160deg,var(--card),var(--acc2));}
.lvl:disabled{filter:grayscale(1);}
.lvl:active,.opt:active,.btn:active,.themeCard:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2);}

/* Juego */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.dots{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
.dots i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.3);}
.dots i.on{background:var(--acc2);}
.dots i.now{background:#fff;transform:scale(1.25);}
.prompt{color:#fff;text-align:center;font-size:clamp(26px,5.5vw,44px);margin:6px 0 10px;line-height:1.2;}
.visual{background:var(--card);border-radius:30px;min-height:170px;padding:14px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.2);margin-bottom:16px;}
.bigE{font-size:clamp(84px,18vw,150px);line-height:1;}
.items{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;font-size:clamp(34px,7vw,54px);max-width:560px;}
.items .x{position:relative;opacity:.35;}
.items .x::after{content:'✖';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--no);opacity:1;font-size:.9em;}
.eq{font-size:clamp(46px,10vw,80px);color:var(--ink);margin:0 10px;}
.sent{font-size:clamp(34px,7vw,56px);}
.blank{display:inline-block;min-width:2.4em;border-bottom:5px solid var(--acc);margin:0 .15em;}
.groups{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:620px;}
.grp{border:3px solid var(--acc);border-radius:14px;padding:5px;display:flex;flex-wrap:wrap;gap:3px;width:70px;justify-content:center;}
.grp b{width:11px;height:11px;border-radius:50%;background:var(--acc);display:block;}
.opts{display:grid;gap:14px;grid-template-columns:repeat(3,1fr);}
.opts.n4{grid-template-columns:repeat(2,1fr);}
.opts.n2{grid-template-columns:repeat(2,1fr);}
.opt{background:var(--card);border-radius:26px;min-height:120px;font-size:clamp(34px,7vw,58px);box-shadow:0 7px 0 rgba(0,0,0,.25);padding:8px;line-height:1.1;transition:opacity .2s;}
.opt.wordy{font-size:clamp(26px,5vw,44px);}
.opt.good{background:var(--ok);color:#fff;}
.opt.bad{background:#f3c7bb;opacity:.45;animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.btn{border-radius:24px;padding:16px 20px;font-size:24px;background:var(--card);box-shadow:0 6px 0 rgba(0,0,0,.25);}
.btn.ok{background:var(--ok);color:#fff;font-size:30px;padding:22px;width:100%;}
.btn.acc{background:var(--acc);color:#fff;}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:14px;}
.link{background:none;color:#fff;opacity:.75;font-size:18px;margin-top:10px;padding:10px;}
.mTip{font-size:22px;opacity:.8;margin-top:8px;}
.mText{font-size:clamp(28px,6vw,46px);}
.modelCard{flex-direction:column;}
.timer{height:22px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden;margin:0 0 14px;}
.timer .bar{height:100%;width:0;background:var(--acc2);border-radius:999px;}
.buddyFloat{position:fixed;left:14px;bottom:calc(10px + env(safe-area-inset-bottom));font-size:54px;z-index:3;pointer-events:none;transition:transform .3s;}
.buddyFloat.jump{transform:translateY(-30px) rotate(-8deg) scale(1.15);}
#mirror{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:min(38vw,260px);aspect-ratio:1;border-radius:50%;object-fit:cover;transform:scaleX(-1);border:6px solid var(--acc2);z-index:4;background:#000;box-shadow:0 8px 20px rgba(0,0,0,.35);}

/* Fin */
.endCard{background:var(--card);border-radius:34px;padding:28px 18px;text-align:center;margin-top:20px;box-shadow:0 10px 0 rgba(0,0,0,.25);}
.endStars{font-size:70px;letter-spacing:6px;}
.endCard h2{font-size:36px;margin:10px 0;}
.endCoins{display:inline-block;background:linear-gradient(180deg,#ffe066,#f5b700);color:#5a3a00;border-radius:999px;padding:8px 20px;font-size:30px;font-weight:900;animation:bump .6s 2;}
.burst{position:fixed;pointer-events:none;font-size:42px;z-index:9;animation:fly 1s ease-out forwards;}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(1.4);opacity:0;}}

/* Pestañas y juegos */
.tabbar{position:sticky;bottom:0;z-index:6;display:flex;gap:10px;padding:12px 0 calc(8px + env(safe-area-inset-bottom));margin-top:auto;background:linear-gradient(transparent,var(--bg2) 35%);}
.tab{flex:1;height:66px;border-radius:22px;font-size:24px;background:rgba(255,255,255,.22);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2);}
.tab.on{background:var(--card);color:var(--ink);}
.gameHead{color:#fff;font-size:26px;margin:14px 4px 10px;display:flex;align-items:center;gap:8px;}
.soon{opacity:.55;}
.cards{display:grid;gap:12px;grid-template-columns:repeat(var(--cols),1fr);max-width:720px;width:100%;margin:0 auto;}
.card{aspect-ratio:3/4;border-radius:22px;font-size:clamp(30px,7.5vw,60px);box-shadow:0 6px 0 rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;padding:6px;line-height:1.05;text-align:center;
  background:linear-gradient(160deg,var(--acc),var(--acc2));color:#fff;transition:transform .25s;}
.card .back{font-size:.9em;opacity:.9;}
.card.open,.card.done{background:var(--card);color:var(--ink);transform:rotateY(0) scale(1.03);}
.card.done{background:#c9f2dc;box-shadow:0 2px 0 rgba(0,0,0,.15);}
.card.small{font-size:clamp(22px,5vw,40px);}
.card .mini{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:.5em;}
img.pic{width:1em;height:1em;object-fit:contain;vertical-align:middle;border-radius:.12em;}
.bigE img.pic{width:1.6em;height:1.6em;border-radius:18px;}
.opt img.pic{width:min(80%,190px);height:auto;aspect-ratio:1;}
.opt:has(img.pic){min-height:160px;}
.card img.pic{width:88%;height:88%;}
.card:not(.small) .mini{font-size:.55em;}
/* Código de Juegos */
#pin{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:16px;}
.pinBox{background:#fff;border-radius:28px;padding:22px;width:100%;max-width:360px;text-align:center;}
.pinBox h3{margin:0 0 12px;font-size:24px;}
.pinDots{display:flex;gap:14px;justify-content:center;margin:6px 0 16px;}
.pinDots i{width:22px;height:22px;border-radius:50%;border:3px solid #999;}
.pinDots i.f{background:#333;border-color:#333;}
.pinDots.err{animation:shake .4s;}
.pinKeys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.pinKeys button{height:68px;border-radius:18px;font-size:30px;background:#f1eee8;box-shadow:0 4px 0 rgba(0,0,0,.15);}
.pinKeys button:active{transform:translateY(3px);box-shadow:none;}

/* ===== Extras: monedas, pegatinas, grabadora, informe ===== */
.coinPill{background:linear-gradient(180deg,#ffe066,#f5b700)!important;color:#5a3a00!important;border:3px solid #fff;font-weight:900;}
.bump{animation:bump .35s;}
@keyframes bump{40%{transform:scale(1.3) rotate(-6deg);}}
.stkPop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;}
.stkCard{background:#fff;border-radius:32px;padding:22px 26px;text-align:center;max-width:360px;width:100%;animation:qpop .5s cubic-bezier(.2,1.6,.4,1);}
@keyframes qpop{from{transform:scale(.5);opacity:0;}}
.stkNew{font-size:22px;color:#b8860b;}
.stkBig{font-size:130px;line-height:1.1;margin:6px 0;animation:bump 1.2s infinite;}
.stkName{font-size:30px;}.stkCount{font-size:16px;opacity:.6;margin:6px 0 12px;}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;}
.stk{background:rgba(255,255,255,.18);border-radius:20px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;border:3px dashed rgba(255,255,255,.35);}
.stk span{font-size:46px;opacity:.35;}.stk small{font-size:12px;}
.stk.got{background:#fff;color:#333;border:3px solid #ffd166;box-shadow:0 4px 0 rgba(0,0,0,.2);}
.stk.got span{opacity:1;}
.recRow{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap;}
.recBtn{border-radius:999px;padding:12px 20px;font-size:22px;background:#ff5d8f;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25);}
.recBtn.play{background:#3da5ff;}
.recBtn.on{background:#e4002b;animation:bump 1s infinite;}
#toastI{position:fixed;top:18px;left:50%;transform:translate(-50%,-120px);background:#fff;color:#222;padding:14px 22px;border-radius:22px;font-size:22px;z-index:45;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .3s;}
#toastI.show{transform:translate(-50%,0);}
.report h4{margin:14px 0 6px;font-size:18px;}
.report table{width:100%;border-collapse:collapse;font-size:14px;}
.report td,.report th{padding:5px 4px;border-bottom:1px solid #eee;text-align:left;}
.bars{display:flex;gap:6px;align-items:flex-end;height:110px;margin:6px 0;}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:11px;height:100%;}
.bars i{display:block;width:100%;border-radius:6px 6px 0 0;background:#3da5ff;min-height:2px;}
.bars b{font-weight:700;font-size:11px;}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.kpis div{background:#f4f1ec;border-radius:14px;padding:10px;text-align:center;font-size:13px;}
.kpis b{display:block;font-size:24px;}

/* ===== Juegos nuevos ===== */
.tgt{display:inline-block;background:#fff;color:var(--ink);border-radius:18px;padding:0 18px;margin-left:6px;font-family:'Nunito',sans-serif;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.2);}
.shake{animation:shake .4s;}
.simon{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:560px;width:100%;margin:10px auto;}
.sBtn{aspect-ratio:1;border-radius:36px;background:var(--c);color:#fff;font-size:clamp(46px,11vw,84px);box-shadow:0 8px 0 rgba(0,0,0,.3);opacity:.75;transition:transform .12s,opacity .12s,filter .12s;}
.sBtn.lit{opacity:1;transform:scale(1.07);filter:brightness(1.35);box-shadow:0 0 0 8px #fff,0 8px 0 rgba(0,0,0,.3);}
.sky{position:relative;flex:1;min-height:60vh;overflow:hidden;border-radius:30px;background:linear-gradient(#bfe6ff,#e9f7ff);}
.balloon{position:absolute;bottom:-150px;width:104px;height:128px;border-radius:50% 50% 48% 48%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.7),var(--c) 45%);color:#fff;font-size:48px;animation:rise linear forwards;box-shadow:inset -8px -10px 0 rgba(0,0,0,.12);}
.balloon::after{content:'';position:absolute;left:50%;bottom:-40px;width:2px;height:40px;background:#777;}
.balloon.pop{animation:popb .3s forwards!important;}
@keyframes rise{to{transform:translateY(calc(-60vh - 320px));}}
@keyframes popb{to{transform:scale(1.8);opacity:0;}}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:600px;width:100%;margin:10px auto;}
.hole{aspect-ratio:1;border-radius:50%;background:radial-gradient(#3b2415 55%,#6b4a2e 57%,#7ccf6b 60%);position:relative;overflow:hidden;}
.mole{position:absolute;left:12%;right:12%;bottom:-80%;height:78%;border-radius:45% 45% 20% 20%;background:#b07a4a;transition:bottom .25s;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:4px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.15);}
.mole.up{bottom:8%;}
.mface{font-size:clamp(26px,6vw,44px);line-height:1;}
.mlbl{background:#fff;color:#222;border-radius:12px;padding:0 10px;font-size:clamp(28px,6vw,46px);margin-top:2px;}
.slots{display:flex;gap:10px;justify-content:center;margin:6px 0 14px;}
.slot{min-width:110px;height:96px;border-radius:20px;border:4px dashed rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-size:52px;color:#fff;}
.slot.full{background:#fff;color:var(--ink);border:4px solid #2bb673;animation:bump .4s;}
.blocks{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;}
.block{min-width:120px;height:100px;border-radius:22px;font-size:50px;background:#ffd166;box-shadow:0 7px 0 #c99a2e;}
.block:nth-child(2n){background:#9ad4ff;box-shadow:0 7px 0 #4d95c9;}.block:nth-child(3n){background:#ffb3c7;box-shadow:0 7px 0 #d06a88;}
.block.used{opacity:.25;}
.shopv{flex-direction:column;}
.tag{background:#ff4d6d;color:#fff;border-radius:16px;padding:6px 22px;font-size:44px;font-weight:900;transform:rotate(-4deg);}
.tray{background:rgba(255,255,255,.2);border-radius:24px;padding:10px;min-height:120px;margin-bottom:12px;}
.trayLbl{color:#fff;font-size:24px;display:block;text-align:center;margin-bottom:6px;}
#trayC{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.purse{display:flex;gap:16px;justify-content:center;}
.money{width:120px;height:120px;border-radius:50%;font-size:30px;font-weight:900;box-shadow:0 7px 0 rgba(0,0,0,.3);color:#4a3000;}
.money.m1{background:radial-gradient(#fff3b0,#e0b030 60%,#b8860b);border:8px solid #c9c9c9;}
.money.m2{background:radial-gradient(#e8e8e8,#bdbdbd 60%,#8a8a8a);border:8px solid #e0b030;}
.money.m5{border-radius:14px;width:170px;background:linear-gradient(135deg,#9ad4c0,#6fb3a0);color:#1f4d40;}
.money.small{width:64px;height:64px;font-size:16px;border-width:5px;box-shadow:0 3px 0 rgba(0,0,0,.3);}
.money.m5.small{width:90px;}
.albumWrap{padding-bottom:30px;}

/* ===== Escribir ===== */
.trWrap{position:relative;margin:0 auto;background:#fff;border-radius:24px;box-shadow:0 6px 0 rgba(0,0,0,.2);touch-action:none;max-width:100%;}
.trWrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
.trBtns{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap;}
.trBtns .btn{font-size:20px;padding:12px 16px;}
.wsecs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;max-width:820px;margin:0 auto;}
.wsec{background:var(--card);border-radius:24px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 6px 0 rgba(0,0,0,.2);font-size:22px;}
.wsec .e{font-size:48px;}.wsec small{font-size:15px;opacity:.7;}.wsec.locked{opacity:.5;}
.wbar{display:block;width:100%;height:12px;background:#e8e3da;border-radius:999px;overflow:hidden;margin-top:4px;}.wbar i{display:block;height:100%;background:linear-gradient(90deg,#4dd26b,#ffd23f);}
.witems{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;max-width:820px;margin:0 auto;}
.witem{position:relative;aspect-ratio:1;border-radius:20px;background:var(--card);font-size:42px;box-shadow:0 5px 0 rgba(0,0,0,.2);}
.witem.done{background:#d8f5e3;}.witem i{position:absolute;top:4px;right:6px;font-size:18px;font-style:normal;}.witem:disabled{opacity:.45;}
.wmodel{text-align:center;color:#fff;font-size:44px;margin:-6px 0 8px;}
.tc-write{background:linear-gradient(160deg,#ff8a3d,#ff6fa8);border:3px solid #fff;grid-column:1/-1;min-height:140px;font-size:30px;}
.tc-write .e{font-size:64px;line-height:1;}
/* Adultos */
#adult{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;}
.panel{background:#fff;border-radius:24px;padding:22px;max-width:480px;width:100%;max-height:90vh;overflow:auto;}
.panel h3{margin:0 0 12px;font-size:24px;}
.panel label{display:block;margin:14px 0 6px;font-size:18px;}
.panel input[type=range]{width:100%;}
.panel .btn{font-size:18px;padding:12px 16px;margin:6px 6px 0 0;}
.panel p{font-size:15px;opacity:.75;font-weight:700;line-height:1.4;}
@media (max-width:420px){.opt{min-height:96px;}.lvls{grid-template-columns:repeat(2,1fr);}}
/* ===== 3D ===== */
html,body{overflow:hidden;height:100%;}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:10px;align-items:center;z-index:5;pointer-events:none;}
#hud>*{pointer-events:auto;}
#hud .pill{background:rgba(0,0,0,.4);font-size:18px;}
#where{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#jump{position:fixed;right:22px;bottom:calc(26px + env(safe-area-inset-bottom));width:104px;height:104px;border-radius:50%;font-size:46px;background:rgba(255,255,255,.85);box-shadow:0 6px 0 rgba(0,0,0,.3);z-index:5;touch-action:none;}
#jump:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3);}
#joyBase{position:fixed;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.22);border:4px solid rgba(255,255,255,.6);z-index:4;pointer-events:none;}
#joyKnob{position:absolute;left:35px;top:35px;width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.9);}
#hint{position:fixed;left:24px;bottom:calc(40px + env(safe-area-inset-bottom));max-width:55vw;background:rgba(0,0,0,.6);color:#fff;padding:14px 20px;border-radius:22px;font-size:20px;z-index:5;pointer-events:none;animation:pulse 1.4s infinite;}
@keyframes pulse{50%{transform:scale(1.05);}}
#toast{position:fixed;top:90px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--ink);padding:14px 22px;border-radius:22px;font-size:24px;z-index:6;box-shadow:0 6px 0 rgba(0,0,0,.25);text-align:center;max-width:90vw;}
#quiz{position:fixed;inset:0;z-index:10;background:rgba(10,10,30,.6);overflow:auto;padding:calc(12px + env(safe-area-inset-top)) 16px 24px;}
.qbox{max-width:820px;margin:0 auto;}
#qtitle{color:#fff;text-align:center;font-size:18px;opacity:.85;}
#menu{position:fixed;inset:0;z-index:20;overflow:auto;padding:calc(14px + env(safe-area-inset-top)) 16px 24px;background:linear-gradient(160deg,#12324a,#3a1466);}
#menuList{display:grid;gap:16px;max-width:760px;margin:0 auto;}
.wcard{display:flex;align-items:center;gap:18px;border-radius:28px;padding:14px;min-height:150px;color:#fff;font-size:28px;text-align:left;box-shadow:0 8px 0 rgba(0,0,0,.3);}
.wcard small{display:block;font-size:18px;opacity:.9;margin-top:6px;}
.wimg{width:120px;height:120px;border-radius:22px;object-fit:cover;border:3px solid rgba(255,255,255,.85);flex:none;}
.w-islas{background:linear-gradient(160deg,#12324a,#1f6f5c);}
.w-gato{background:linear-gradient(160deg,#5a1a2e,#b8473a);}
.w-stranger{background:linear-gradient(160deg,#140a2e,#3a1466);border:3px solid #29e7ff;}
#coinBox{background:linear-gradient(180deg,#ffe066,#f5b700)!important;color:#5a3a00!important;font-size:28px!important;padding:8px 18px!important;border:3px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.25);min-width:96px;text-align:center;}
#coinBox.bump{animation:bump .35s;}
@keyframes bump{40%{transform:scale(1.35) rotate(-6deg);}}
.steer{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;font-size:60px;background:rgba(255,255,255,.85);box-shadow:0 6px 0 rgba(0,0,0,.3);z-index:5;touch-action:none;display:none;}
.steer.on{background:#ffd166;transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3);}
#steerL{left:22px;}#steerR{right:22px;}
body.kart .steer{display:none;}body.kart #jump{display:none;}
#speedWrap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(30px + env(safe-area-inset-bottom));width:min(40vw,260px);height:18px;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden;z-index:5;display:none;border:2px solid rgba(255,255,255,.7);}
#speedo{height:100%;width:0;background:linear-gradient(90deg,#4dd26b,#ffe03d,#ff4d4d);}
body.kart #speedWrap{display:block;}
body.kart #hint{animation:none;left:50%;transform:translateX(-50%);bottom:calc(170px + env(safe-area-inset-bottom));max-width:80vw;text-align:center;}
/* retos más vistosos */
#quiz .qbox{background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:3px solid rgba(255,255,255,.35);border-radius:32px;padding:14px;margin-top:6px;}
#quiz .qbox.pop{animation:qpop .45s cubic-bezier(.2,1.6,.4,1);}
@keyframes qpop{from{transform:scale(.6);opacity:0;}}
#qstars{flex:1;text-align:center;font-size:38px;letter-spacing:6px;}
#qstars span{display:inline-block;color:#fff;}
#qstars .got{animation:bump .5s;}
.qhead{display:flex;align-items:center;gap:12px;margin:8px 0 10px;}
#qav{width:84px;height:84px;border-radius:50%;object-fit:cover;border:4px solid #ffd166;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.35);animation:wob 2.4s ease-in-out infinite;}
@keyframes wob{50%{transform:rotate(-6deg) scale(1.05);}}
.bubble{position:relative;flex:1;background:#fff;color:var(--ink);border-radius:24px;padding:14px 18px;font-size:clamp(24px,5vw,38px);box-shadow:0 5px 0 rgba(0,0,0,.2);}
.bubble::before{content:'';position:absolute;left:-14px;top:50%;margin-top:-12px;border:12px solid transparent;border-right-color:#fff;border-left:0;}
#qtitle{display:inline-block;background:rgba(0,0,0,.35);border-radius:999px;padding:6px 14px;margin:0 auto 10px;font-size:17px;}
.qtwrap{text-align:center;}
.qintro{font-size:90px;animation:bump 1s infinite;}
.qopts .opt{animation:inopt .45s cubic-bezier(.2,1.5,.4,1) both;border:4px solid rgba(0,0,0,.08);}
.qopts .opt:nth-child(1){background:#ffe3ec;}.qopts .opt:nth-child(2){background:#e1f1ff;}.qopts .opt:nth-child(3){background:#fff3cf;}.qopts .opt:nth-child(4){background:#e5fbe7;}
.qopts .opt.good{background:#2bb673!important;color:#fff;transform:scale(1.08);box-shadow:0 0 0 6px #b8f5d4,0 7px 0 rgba(0,0,0,.25);}
@keyframes inopt{from{transform:translateY(40px) scale(.7);opacity:0;}}
.qrow{display:flex;gap:12px;flex-wrap:wrap;}
.qbtn{flex:1;min-height:90px;border-radius:26px;font-size:28px;box-shadow:0 7px 0 rgba(0,0,0,.25);}
.qrep{background:#fff;flex:.6;}.qok{background:#2bb673;color:#fff;font-size:32px;}
.qok.good{transform:scale(1.05);}
/* menú con dos modos */
.wcard{cursor:default;}
.wt{flex:1;}
.wbtns{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
.wbtns button{flex:1;min-width:130px;border-radius:20px;padding:12px 10px;font-size:22px;background:#fff;color:#222;box-shadow:0 5px 0 rgba(0,0,0,.25);}
.wbtns button small{display:block;font-size:14px;opacity:.7;margin-top:2px;}
.wbtns button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25);}


/* tienda, álbum y menú */
.menuCoins{text-align:center;margin:-4px 0 10px;}.menuCoins .pill{font-size:24px;padding:8px 18px;}
#menuTop{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:760px;margin:0 auto 14px;}
.mbig{border-radius:26px;min-height:110px;font-size:28px;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.3);}
.mbig small{display:block;font-size:15px;opacity:.9;margin-top:4px;}
.shopB{background:linear-gradient(160deg,#ff6fa8,#ff8a3d);}.albB{background:linear-gradient(160deg,#3da5ff,#7a5bff);}
#shop,#album{position:fixed;inset:0;z-index:21;overflow:auto;padding:calc(12px + env(safe-area-inset-top)) 16px 24px;background:linear-gradient(160deg,#3a1466,#12324a);}
.shopT{flex:1;text-align:center;color:#fff;margin:0;font-size:30px;}
#shopCv{display:block;width:100%;max-width:520px;height:min(40vh,340px);margin:0 auto;border-radius:28px;background:radial-gradient(circle at 50% 40%,#ffffff33,#ffffff08);}
#shopTabs{display:flex;gap:8px;overflow-x:auto;padding:10px 2px;max-width:900px;margin:0 auto;}
.stab{flex:none;min-width:86px;border-radius:18px;padding:8px 10px;font-size:30px;background:rgba(255,255,255,.2);color:#fff;}
.stab small{display:block;font-size:12px;}
.stab.on{background:#fff;color:#222;}
#shopItems{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-width:900px;margin:0 auto;}
.sitem{background:#fff;border-radius:22px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:18px;box-shadow:0 6px 0 rgba(0,0,0,.25);}
.sitem.on{box-shadow:0 0 0 5px #2bb673,0 6px 0 rgba(0,0,0,.25);}
.sitem.lock{background:#f1eee8;}
.sw{width:54px;height:54px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #ccc;}
.swE{font-size:44px;line-height:1;}
.sprice{background:linear-gradient(180deg,#ffe066,#f5b700);color:#5a3a00;border-radius:999px;padding:4px 12px;font-size:16px;}
.sitem.on .sprice{background:#2bb673;color:#fff;}
#albumBox{max-width:900px;margin:0 auto;}

/* crucero */
.w-crucero{background:linear-gradient(160deg,#0f5c8c,#2bb3d6);border:3px solid #fff;}
#mission{position:fixed;top:calc(74px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);color:#222;border-radius:999px;padding:10px 22px;font-size:24px;z-index:6;box-shadow:0 5px 0 rgba(0,0,0,.25);white-space:nowrap;}
#mission b{font-size:28px;}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:30;transition:opacity .35s;}
#fade.on{opacity:1;}

/* necesidades, menú de comida y puzle lego */
#needs{position:fixed;top:calc(70px + env(safe-area-inset-top));left:12px;background:rgba(0,0,0,.55);color:#fff;border-radius:18px;padding:8px 14px;font-size:20px;z-index:6;white-space:nowrap;}
#needs .nb{font-style:normal;color:#4dd26b;letter-spacing:-2px;margin-left:3px;}#needs .nb span{color:rgba(255,255,255,.25);}
#needs .low .nb{color:#ff4d4d;}#needs .low{animation:bump 1s infinite;display:inline-block;}
body.ship #mission{top:calc(122px + env(safe-area-inset-top));}
#pick,#legoPz{position:fixed;inset:0;z-index:25;background:rgba(10,10,30,.65);display:flex;align-items:center;justify-content:center;padding:16px;}
.pickBox,.lgBox{background:#fff;border-radius:30px;padding:18px;max-width:640px;width:100%;text-align:center;animation:qpop .4s cubic-bezier(.2,1.6,.4,1);}
.pickT{font-size:32px;}.pickSub{font-size:17px;opacity:.7;margin:4px 0 12px;}
.pickItems{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:12px;}
.pickItems button{border-radius:24px;padding:12px 4px;font-size:17px;overflow-wrap:anywhere;background:#fff3cf;box-shadow:0 6px 0 rgba(0,0,0,.2);}
.pickItems button span{display:block;font-size:64px;line-height:1.1;}
.pickItems button:nth-child(2n){background:#e1f1ff;}.pickItems button:nth-child(3n){background:#ffe3ec;}
.lgHead{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.lgHead .btn{padding:8px 14px;font-size:20px;}.lgT{flex:1;font-size:26px;}
.lgBoard{position:relative;margin:0 auto 14px;background:#2fbf5a;border-radius:10px;padding:0;background-image:radial-gradient(circle,#48d673 28%,transparent 30%);background-size:32px 32px;box-shadow:inset 0 0 0 6px #28a84f;}
.lgSlot{position:absolute;border:4px dashed;border-radius:8px;margin:2px;box-sizing:border-box;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;}
.lgSlot.hintOn{animation:bump 1s infinite;background:rgba(255,255,255,.55);}
.lgSlot.full{border:none;background:none;animation:none;}
.lgTray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;background:#f4f1ec;border-radius:18px;padding:12px;}
.lgPiece{background:none;padding:4px;border-radius:12px;}.lgPiece.sel{background:#ffd23f;transform:translateY(-6px);}.lgPiece.used{visibility:hidden;}
.lb{border-radius:6px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 3px 0 rgba(0,0,0,.25);background-image:radial-gradient(circle,rgba(255,255,255,.35) 22%,transparent 24%);background-size:var(--s) var(--s);}
.lgHint{margin-top:10px;font-size:18px;opacity:.75;}

#qvisual #qtr .trBtns .btn{font-size:17px;padding:10px 12px;}
</style>
</head>

const missing=new Set();const player=new Audio();player.preload='auto';player.setAttribute('playsinline','');
let sayToken=0;
function stopSpeech(){sayToken++;try{player.pause();}catch(e){}if('speechSynthesis' in window)speechSynthesis.cancel();}
function filePart(s){return new Promise(res=>{
  if(missing.has(s))return res(false);
  let done=false,to;const fin=(ok,mark)=>{if(done)return;done=true;clearTimeout(to);player.onended=player.onerror=null;if(mark)missing.add(s);res(ok);};
  player.onended=()=>fin(true);player.onerror=()=>fin(false,true);
  player.src=AUDIO_DIR+s+AUDIO_EXT;const p=player.play();if(p&&p.catch)p.catch(err=>fin(false,err&&err.name!=='NotAllowedError'&&err.name!=='AbortError'));
  to=setTimeout(()=>fin(true),15000);});}
function ttsPart(t,rate){return new Promise(res=>{
  if(!('speechSynthesis' in window))return res();
  const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';if(voice)u.voice=voice;u.rate=rate||S.rate;u.pitch=1.05;
  let done=false;const fin=()=>{if(!done){done=true;res();}};u.onend=fin;u.onerror=fin;setTimeout(fin,1500+t.length*130);
  setTimeout(()=>speechSynthesis.speak(u),60);});}
async function say(t,rate){
  if(!t)return;stopSpeech();const my=sayToken;
  const parts=String(t).split('|').map(x=>x.trim()).filter(Boolean);
  for(const p of parts){
    if(my!==sayToken)return;const s=slug(p);if(!s)continue;
    const ok=await filePart(s);if(my!==sayToken)return;
    if(!ok)await ttsPart(p,rate);
  }
}

let AC;
function tone(fs,dur=.14,type='sine',gap=.09,vol=.22){
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime;fs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
      const s=t+i*gap;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(vol,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+dur);
      o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+dur+.05);});
  }catch(e){}
}

  const btn=root.querySelector('[data-rec=rec]');

  if(!window.MediaRecorder){alert('Este dispositivo no permite grabar.');return;}

  const chunks=[];const mt=MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':'';
  recorder=new MediaRecorder(recStream,mt?{mimeType:mt}:undefined);
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  recorder.onstop=()=>{clearTimeout(recTimer);btn.classList.remove('on');btn.textContent='🎤 Otra vez';if(recURL)URL.revokeObjectURL(recURL);

}

function smoothPts(pts,step){if(pts.length<3)return resample(pts,step);const out=[];for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    for(let t=0;t<1;t+=.1){const t2=t*t,t3=t2*t;out.push([.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)]);}}

function resample(pts,step){const out=[pts[0]];let acc=0;for(let i=1;i<pts.length;i++){let [ax,ay]=out[out.length-1],[bx,by]=pts[i];let d=Math.hypot(bx-ax,by-ay);
    while(d>=step){const t=step/d;ax=ax+(bx-ax)*t;ay=ay+(by-ay)*t;out.push([ax,ay]);d=Math.hypot(bx-ax,by-ay);}}

function mountTrace(host,opt){
  const upper=!!opt.upper,mode=opt.mode||'guia';const C=composeText(opt.text,upper);
  const W=Math.min(opt.maxW||760,host.clientWidth||600),H=opt.h||Math.round(Math.min(W*.8,innerHeight*.52,560));
  const top=upper?-2.9:-2.35,bot=upper?.25:1.25;const sc=Math.min((W-40)/Math.max(C.w,2.2),(H-20)/(bot-top));const ox=(W-C.w*sc)/2,oy=10-top*sc+((H-20)-(bot-top)*sc)/2;
  const P=([x,y])=>[ox+x*sc,oy+y*sc];
  const paths=C.strokes.map(s=>s.lin?resample(s.map(P),3):smoothPts(s.map(P),3));
  host.innerHTML='<div class="trWrap" style="width:'+W+'px;height:'+H+'px"><canvas class="trBg" width="'+W*2+'" height="'+H*2+'"></canvas><canvas class="trFg" width="'+W*2+'" height="'+H*2+'"></canvas></div>'+
    '<div class="trBtns"><button class="btn" data-tr="clr">🧽 Borrar</button><button class="btn" data-tr="demo">👀 Ver cómo</button>'+(mode==='libre'?'<button class="btn ok" data-tr="chk" style="width:auto">✅ ¡Ya está!</button>':'')+'</div>';
  const bg=host.querySelector('.trBg').getContext('2d'),fg=host.querySelector('.trFg').getContext('2d'),fgC=host.querySelector('.trFg');bg.scale(2,2);fg.scale(2,2);
  const lw=Math.max(10,sc*.2),tol=Math.max(26,sc*.42);
  function drawBg(){bg.clearRect(0,0,W,H);bg.strokeStyle='#cfd8e3';bg.lineWidth=2;
    const lines=upper?[-2.2,-1.1,0]:[-2.2,-1,0,1.1];lines.forEach((y,i)=>{bg.setLineDash(y===0?[]:[8,8]);bg.strokeStyle=y===0?'#7aa6d6':'#cfd8e3';bg.beginPath();bg.moveTo(8,oy+y*sc);bg.lineTo(W-8,oy+y*sc);bg.stroke();});bg.setLineDash([]);
    if(mode==='guia'||showModel){bg.lineCap='round';bg.lineJoin='round';bg.strokeStyle=mode==='guia'?'#e3e8ef':'rgba(160,170,190,.35)';bg.lineWidth=lw*1.9;paths.forEach(p=>{bg.beginPath();p.forEach(([x,y],i)=>i?bg.lineTo(x,y):bg.moveTo(x,y));bg.stroke();});
      if(mode==='guia'){bg.strokeStyle='#b8c4d4';bg.lineWidth=2;bg.setLineDash([6,8]);paths.forEach(p=>{bg.beginPath();p.forEach(([x,y],i)=>i?bg.lineTo(x,y):bg.moveTo(x,y));bg.stroke();});bg.setLineDash([]);
        paths.forEach((p,i)=>{const [x,y]=p[0];bg.fillStyle=i===si?'#2bb673':'#9aa7b5';bg.beginPath();bg.arc(x,y,lw*.9,0,Math.PI*2);bg.fill();bg.fillStyle='#fff';bg.font='bold '+Math.round(lw*1.1)+'px Nunito,sans-serif';bg.textAlign='center';bg.textBaseline='middle';bg.fillText(i+1,x,y+1);});}}}
  let si=0,pi=0,showModel=false,drawing=false,user=[],curU=null,done=false,demoT=null;const COL=['#ff4d6d','#ff8a3d','#ffd23f','#4dd26b','#3da5ff','#b07cff'];
  function drawFg(){fg.clearRect(0,0,W,H);fg.lineCap='round';fg.lineJoin='round';
    if(mode==='guia'){for(let k=0;k<=si&&k<paths.length;k++){const p=paths[k],n=k<si?p.length:pi+1;if(n<2)continue;const g=fg.createLinearGradient(0,0,W,0);COL.forEach((c,i)=>g.addColorStop(i/(COL.length-1),c));fg.strokeStyle=g;fg.lineWidth=lw;fg.shadowColor='rgba(255,210,63,.8)';fg.shadowBlur=12;fg.beginPath();for(let i=0;i<n;i++){const [x,y]=p[i];i?fg.lineTo(x,y):fg.moveTo(x,y);}fg.stroke();fg.shadowBlur=0;}
      if(!done&&paths[si]){const [x,y]=paths[si][Math.min(pi+1,paths[si].length-1)];fg.fillStyle='rgba(255,255,255,.95)';fg.strokeStyle='#2bb673';fg.lineWidth=4;fg.beginPath();fg.arc(x,y,lw*.75,0,Math.PI*2);fg.fill();fg.stroke();fg.font=Math.round(lw*1.3)+'px "Apple Color Emoji",sans-serif';fg.textAlign='center';fg.textBaseline='middle';fg.fillText('⭐',x,y);}}
    else{fg.strokeStyle='#3d6fd6';fg.lineWidth=lw*.8;user.forEach(s=>{if(s.length<2){if(s.length){fg.fillStyle='#3d6fd6';fg.beginPath();fg.arc(s[0][0],s[0][1],lw*.4,0,Math.PI*2);fg.fill();}return;}fg.beginPath();s.forEach(([x,y],i)=>i?fg.lineTo(x,y):fg.moveTo(x,y));fg.stroke();});}}
  function pt(e){const r=fgC.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];}
  function finish(){done=true;drawFg();sfx.win();opt.onDone&&opt.onDone();}
  fgC.addEventListener('pointerdown',e=>{if(done)return;e.preventDefault();stopDemo();drawing=true;try{fgC.setPointerCapture(e.pointerId);}catch(_){}
    const q=pt(e);if(mode==='libre'){curU=[q];user.push(curU);drawFg();}else guide(q);});
  fgC.addEventListener('pointermove',e=>{if(!drawing||done)return;e.preventDefault();const q=pt(e);if(mode==='libre'){curU.push(q);drawFg();}else guide(q);});
  const up=()=>{drawing=false;};fgC.addEventListener('pointerup',up);fgC.addEventListener('pointercancel',up);
  function guide([x,y]){const p=paths[si];if(!p)return;let best=-1;for(let k=pi;k<Math.min(p.length,pi+14);k++){if(Math.hypot(p[k][0]-x,p[k][1]-y)<tol)best=k;}
    if(best>pi){pi=best;if(pi%6===0)tone([500+pi*3],.03,'sine',.01,.05);}
    if(pi>=p.length-3){si++;pi=0;sfx.ok();drawBg();if(si>=paths.length){finish();return;}}drawFg();}
  function check(){if(done)return;const T=paths.flat(),U=user.flat();if(U.length<5){sfx.no();say('¡Escribe la letra con el dedo!');return;}
    const near=(a,B,t)=>B.some(b=>Math.hypot(a[0]-b[0],a[1]-b[1])<t);const cov=T.filter(a=>near(a,U,tol*1.15)).length/T.length,prec=U.filter(a=>near(a,T,tol*1.25)).length/U.length;
    logAnswer('Escribir '+(mode==='libre'?'libre':'guiado'),null,null,cov>.72&&prec>.65);
    if(cov>.72&&prec>.65){finish();}else{sfx.no();say(pick(['Casi. Prueba otra vez.','¡Tú puedes! Otra vez.']));showModel=true;drawBg();setTimeout(()=>{showModel=false;user=[];drawBg();drawFg();},1800);}}
  function stopDemo(){if(demoT){clearInterval(demoT);demoT=null;drawFg();}}
  function demo(){stopDemo();let k=0,i=0;demoT=setInterval(()=>{drawFg();const p=paths[k];if(!p){stopDemo();return;}i+=3;if(i>=p.length){k++;i=0;return;}const [x,y]=p[i];fg.font=Math.round(lw*2)+'px "Apple Color Emoji",sans-serif';fg.textAlign='center';fg.textBaseline='middle';fg.fillText('✏️',x+lw*.6,y-lw*.6);
      fg.strokeStyle='rgba(43,182,115,.6)';fg.lineWidth=lw*.5;fg.beginPath();for(let j=0;j<=i;j++){const [a,b]=p[j];j?fg.lineTo(a,b):fg.moveTo(a,b);}fg.stroke();},30);}
  host.querySelector('.trBtns').addEventListener('click',e=>{const b=e.target.closest('[data-tr]');if(!b||done)return;const a=b.dataset.tr;sfx.tap();
    if(a==='clr'){si=0;pi=0;user=[];drawBg();drawFg();}if(a==='demo')demo();if(a==='chk')check();});
  drawBg();drawFg();if(opt.demo!==false&&mode==='guia')setTimeout(demo,500);
  return{destroy(){stopDemo();}};}

function buildPet(type){

  const body=abox(.9,.7,1.2,C[0],0,.55,0);const head=abox(.8,.75,.75,C[0],0,1.15,.55);g.add(body,head);

    g.add(abox(.18,.6,.6,C[1],0,1.35,.2));g.add(abox(.18,.5,.3,C[1],0,.9,-.75));}
  g.scale.setScalar(.75);return g;

function petStep(pet,target,yawT,dt,tm,moving){if(!pet)return;const want=target;pet.position.x+=(want.x-pet.position.x)*Math.min(1,dt*4);pet.position.z+=(want.z-pet.position.z)*Math.min(1,dt*4);
  pet.position.y=want.y+(moving?Math.abs(Math.sin(tm*9))*.35:Math.abs(Math.sin(tm*2))*.08);
  let d=yawT-pet.rotation.y;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;pet.rotation.y+=d*Math.min(1,dt*6);
  if(pet.userData.wings)pet.userData.wings.forEach((w,i)=>w.rotation.z=(i%2?-1:1)*(.5+Math.sin(tm*14)*.35));}
